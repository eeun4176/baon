# ci.yml — Runs on every push and pull request: lint, tests and a production build,
# so a broken commit is caught on GitHub before Vercel deploys it.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build only needs the names to exist; the real addresses live in Vercel.
      - run: npm run build
        env:
          VITE_NEON_AUTH_URL: https://example.invalid/auth
          VITE_NEON_DATA_API_URL: https://example.invalid/data
