<!doctype html>
<!-- index.html — The single HTML page of the app. Vite injects the bundled JS here;
     the PWA plugin adds the manifest link. React renders into #root. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F4F4" />
    <meta name="description" content="Know what you can spend today — log your baon in seconds, even without load or Wi-Fi." />
    <title>baon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
